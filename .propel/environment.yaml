stack: python-pytest+node-vitest
install_cmd: (pip install -r requirements.in) && (npm install)
syntax_cmd: (python -c "import os, sys; S = {'node_modules', '.venv', '.propel', 'vendor',
  '.git', '__pycache__', 'dist', 'build', '.tox', '.mypy_cache'}; P = [os.path.join(r,
  f) for r, d, fs in os.walk('.') if not d.__setitem__(slice(None), [x for x in d
  if x not in S]) for f in fs if f.endswith('.py')]; [compile(open(p, encoding='utf-8').read(),
  p, 'exec') for p in P]") && (find . -path ./node_modules -prune -o \( -name '*.js'
  -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check)
build_cmd: (python -m compileall -q -x '/(node_modules|\.venv|\.propel|vendor|\.git)/'
  .) && (npm run build --if-present)
test_cmd: (echo __PROPEL_STACK__:python-pytest; python -m pytest -q) && (echo __PROPEL_STACK__:node-vitest;
  npx vitest run --globals --environment jsdom)
test_selector: PROPEL_TEST="{path}"; case "$PROPEL_TEST" in *) echo __PROPEL_STACK__:python-pytest;
  (python -m pytest -q {path}) ;; esac
dependency_file: requirements.in
runtime_version: '3.12'
member_dirs:
  python-pytest: .
  node-vitest: .
start_cmd: sh -c 'JWT_SECRET="$(python -c "import secrets; print(secrets.token_hex(32))")"
  python -m uvicorn api.app.main:app --host 127.0.0.1 --port 8000 & exec npx vite
  --host 0.0.0.0 --port 5173 --strictPort'
start_port: 5173
